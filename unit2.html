<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Technical Seminar - Unit 2</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #f59e0b; /* Golden accent for Unit 2 */
            --done-color: #10b981;
            --pending-color: #f59e0b;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --border: #334155;
            --glass: rgba(30, 41, 59, 0.7);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .header-section {
            text-align: center;
            padding: 40px 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .header-section h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #f59e0b, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .search-container {
            position: sticky;
            top: 20px;
            z-index: 100;
            max-width: 600px;
            margin: 0 auto 40px;
        }

        #searchInput {
            width: 100%;
            padding: 15px 25px;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: var(--glass);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
            max-width: 1350px;
            margin: 0 auto;
        }
      
        .card:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .student-name::before {
            content: ">_";
            margin-right: 10px;
            opacity: 0.5;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            position: relative;
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        .card.is-done { border-color: var(--done-color); border-left: 6px solid var(--done-color); }
        .card.is-pending { border-left: 6px solid var(--pending-color); }

        .status-badge {
            align-self: flex-end;
            font-size: 0.65rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 10px;
        }
        .status-badge.done { background: rgba(16, 185, 129, 0.2); color: var(--done-color); }
        .status-badge.pending { background: rgba(245, 158, 11, 0.2); color: var(--pending-color); }

        .student-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 15px;
        }

        .score-pill {
            background: var(--done-color);
            color: #fff;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-left: 10px;
        }

        .topic-box {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px dashed var(--border);
        }

        .topic-title { font-weight: 600; color: var(--accent); font-size: 0.95rem; }
        .depth-desc { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 20px; flex-grow: 1; }
        .meta-tags { display: flex; gap: 8px; flex-wrap: wrap; }
        .tag { font-size: 0.7rem; background: #334155; padding: 3px 8px; border-radius: 4px; color: #cbd5e1; }
    </style>
</head>
<body>

<div class="header-section">
    <h1>Java Unit 2 Seminar</h1>
    <p>Fundamental Concepts: Presentation Schedule & Dashboard</p>
</div>

<div class="search-container">
    <input type="text" id="searchInput" placeholder="Search student name or topic..." onkeyup="filterCards()">
</div>

<div class="container" id="cardContainer"></div>

<script>
    // Data mapped from Unit 1 names to Unit 2 PDF Topics 
    const data = [
        { name: "Himesh Nath", topic: "Java Tokens & Identifiers", depth: "Breaking down code into keywords, literals, and identifiers.", isDone: false, score: null, tech: ["Whiteboard"] },
        { name: "Prashant Paneru", topic: "Primitive Data Types & Memory", depth: "Table of sizes (bits) and ranges for all 8 primitive types.", isDone: false, score: null, tech: ["Digital Slides"] },
        { name: "Sumit Rokaya", topic: "Type Casting: Narrowing vs. Widening", depth: "Implicit vs. Explicit conversion with code examples.", isDone: false, score: null, tech: ["Live Code"] },
        { name: "Ravi Prasad Kalauni", topic: "Arithmetic & Relational Operators", depth: "Hierarchy of operations and boolean logic results.", isDone: false, score: null, tech: ["Whiteboard"] },
        { name: "Puja Bhatt", topic: "The Ternary Operator", depth: "Replacing simple if-else with ?: syntax efficiently.", isDone: false, score: null, tech: ["Live Code"] },
        { name: "Himanshu Pandeya", topic: "Naming Conversions", depth: "Best practices for naming variables, constants, and methods.", isDone: false, score:null, tech: ["Digital Slides"] },
        { name: "Jeevan Bhatta", topic: "Constants & the 'final' Keyword", depth: "How to declare unchangeable variables in Java.", isDone: false, score: null, tech: ["Digital Slides"] },
        { name: "Deepak Bohara", topic: "If-Else Ladder vs. Switch Case", depth: "When to use which for efficiency and readability.", isDone: false, score: null, tech: ["Digital Slides"] },
        { name: "Parwati Kumari Saud", topic: "The Switch Statement Evolution", depth: "Handling multiple cases and the default block.", isDone: false, score: null, tech: ["Live Code"] },
        { name: "Prerana Bhatt", topic: "While vs. Do-While Loops", depth: "Explaining 'exit-controlled' vs 'entry-controlled' logic.", isDone: false, score: null, tech: ["Whiteboard"] },
        { name: "Monika Bhatt", topic: "For Loop Anatomy", depth: "Initialization, Condition, and Increment/Decrement breakdown.", isDone: false, score: null, tech: ["Whiteboard"] },
        { name: "Samikshya Bhatt", topic: "Nested Loops & Pattern Logic", depth: "Developing logic for a simple star or number triangle.", isDone: false, score: null, tech: ["Live Code"] },
        { name: "Mahesh Prasad Bhatt", topic: "Jump Statements: Break & Continue", depth: "Controlling loop flow and skipping iterations.", isDone: false, score: null, tech: ["Digital Slides"] },
        { name: "Sagar Bhatta", topic: "Return Statement Logic", depth: "How values are passed back from methods to callers.", isDone: false, score: null, tech: ["Whiteboard"] },
        { name: "Kabi Raj Bhatt", topic: "Scanner Class for Input", depth: "Using next(), nextLine(), and nextInt() effectively.", isDone: false, score: null, tech: ["Live Code"] },
        { name: "Raksha Bhatt", topic: "1D Array Declaration & Init", depth: "Syntax for declaring, instantiating, and initializing arrays.", isDone: false, score: null, tech: ["Digital Slides"] },
        { name: "Kusum Dhami", topic: "Array Traversal Techniques", depth: "Using standard for loops vs the enhanced for-each loop.", isDone: false, score: null, tech: ["Live Code"] },
        { name: "Laxmi Kumari Bhatta", topic: "Memory Map of Arrays", depth: "Visualizing how arrays are stored in the heap memory.", isDone: false, score: null, tech: ["Whiteboard"] },
        { name: "Bishal Joshi", topic: "Finding Extremes in Arrays", depth: "Logic for finding the Largest and Smallest elements.", isDone: false, score: null, tech: ["Live Code"] },
        { name: "Dipika Chand", topic: "2D Array: The Matrix Structure", depth: "Handling rows and columns using nested loops.", isDone: false, score: null, tech: ["Whiteboard"] },
        { name: "Rohit Joshi", topic: "Jagged Arrays in Java", depth: "Creating arrays with varying column lengths.", isDone: false, score: null, tech: ["Live Code"] },
        { name: "Lochan Bhatta", topic: "Array Length vs String Length", depth: "Difference between .length property and .length() method.", isDone: false, score: null, tech: ["Digital Slides"] },
        { name: "Avinab Chand", topic: "String Immutability Concept", depth: "Why Strings cannot be changed once created in memory.", isDone: false, score: null, tech: ["Whiteboard"] },
        { name: "Priti Joshi", topic: "String Concatenation Methods", depth: "Using + operator vs .concat() method in logic.", isDone: false, score: null, tech: ["Live Code"] },
        { name: "Gayatri Bhatt", topic: "String Comparison Deep Dive", depth: "Fundamental differences between == and .equals().", isDone: false, score: null, tech: ["Digital Slides"] },
        { name: "Prem Raj Pant", topic: "The StringBuffer Class", depth: "Mutability and common methods like append() and reverse().", isDone: false, score: null, tech: ["Live Code"] },
        { name: "Sabina Joshi", topic: "String Search Methods", depth: "Using indexOf(), lastIndexOf(), and contains().", isDone: false, score: null, tech: ["Digital Slides"] },
        { name: "Hridayendra Chand", topic: "Escape Sequences & Formatting", depth: "Mastering \\n, \\t along with System.out.printf.", isDone: false, score: null, tech: ["Live Code"] },
        { name: "Bhuwan Joshi", topic: "Word Counting Logic", depth: "Practical application: counting words in a text string.", isDone: false, score: null, tech: ["Whiteboard"] },
        { name: "Hemant Rawal", topic: "Predefined Methods in Java", depth: "Overview of Math class methods (sqrt, pow, random).", isDone: false, score: null, tech: ["Digital Slides"] },
        { name: "Nabin Karki", topic: "User-Defined Method Structure", depth: "Defining access modifiers, return types, and parameters.", isDone: false, score: null, tech: ["Whiteboard"] },
        { name: "Pankaj Chand", topic: "Static Methods vs Instance", depth: "Calling methods without creating an object instance.", isDone: false, score: null, tech: ["Digital Slides"] },
        { name: "Aayush Thakurathi", topic: "Method Parameters & Arguments", depth: "Explaining 'Pass by Value' logic in Java.", isDone: false, score: null, tech: ["Whiteboard"] },
        { name: "Aayush Ayer", topic: "Method Overloading (Basics)", depth: "Same name, different parameters within the same class.", isDone: false, score: null, tech: ["Live Code"] },
        { name: "Ashish Bhatt", topic: "Recursion Fundamentals", depth: "A method calling itself (example: Factorial logic).", isDone: false, score: null, tech: ["Whiteboard"] },
        { name: "Simon Joshi", topic: "Unit 2 Best Practices", depth: "Summarizing naming conventions and coding standards.", isDone: false, score: null, tech: ["Digital Slides"] }
    ];

    function renderCards(filter = "") {
        const container = document.getElementById('cardContainer');
        container.innerHTML = "";
        
        data.filter(s => 
            s.name.toLowerCase().includes(filter.toLowerCase()) || 
            s.topic.toLowerCase().includes(filter.toLowerCase())
        ).forEach(student => {
            const card = `
                <div class="card ${student.isDone ? 'is-done' : 'is-pending'}">
                    <div class="status-badge ${student.isDone ? 'done' : 'pending'}">
                        ${student.isDone ? 'Completed' : 'Upcoming'}
                    </div>
                    <div class="student-name">
                        ${student.name} 
                        ${student.isDone ? `<span class="score-pill">${student.score}/10</span>` : ''}
                    </div>
                    <div class="topic-box">
                        <div class="topic-title">${student.topic}</div>
                    </div>
                    <div class="depth-desc"><strong>Target:</strong> ${student.depth}</div>
                    <div class="meta-tags">
                        <span class="tag">5-7 Min</span>
                        ${student.tech.map(t => `<span class="tag">${t}</span>`).join('')}
                    </div>
                </div>
            `;
            container.innerHTML += card;
        });
    }

    function filterCards() {
        const query = document.getElementById('searchInput').value;
        renderCards(query);
    }

    renderCards();
</script>

</body>
</html>
